name: Deploy Agama Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: agama-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Agama
        uses: actions/checkout@v4

      - name: Verify standalone webbook source
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f reader.html
          test -f reader.js
          test -f style.css
          test -f app.js
          test -f volumes.js
          grep -q '제1~10권' index.html
          grep -q '\[10,256,272,17,"published"' volumes.js
          for n in 01 02 03 04 05 06; do test -f "volumes/$n.md"; done
          test -f volumes/07.seg1.mdpart
          test -f volumes/08.seg1.mdpart
          test -f volumes/09.seg1.mdpart
          test -f volumes/10.seg1.mdpart
          echo 'Agama source verification passed.'

      - name: Stage Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp index.html reader.html reader.js style.css app.js volumes.js dist/
          cp -R volumes dist/
          printf 'agama-pages-ok\n' > dist/health.txt
          touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
