name: Deploy Agama Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '.deployment/**'
      - '.github/workflows/report-pages-runs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: agama-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Agama
        uses: actions/checkout@v4

      - name: Verify standalone webbook source
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f reader.html
          test -f reader.js
          test -f style.css
          test -f app.js
          test -f volumes.js
          grep -q '제1~12권' index.html
          grep -q '\[12,283,303,21,"published"' volumes.js
          for n in 01 02 03 04 05 06 11 12; do test -f "volumes/$n.md"; done
          test -f volumes/07.seg1.mdpart
          test -f volumes/08.seg1.mdpart
          test -f volumes/09.seg1.mdpart
          test -f volumes/10.seg1.mdpart
          echo 'Agama source verification passed.'

      - name: Stage Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp index.html reader.html reader.js style.css app.js volumes.js dist/
          cp -R volumes dist/
          printf 'agama-pages-ok\n' > dist/health.txt
          touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published Agama site
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}/"
          ok=0
          for i in $(seq 1 12); do
            rm -f /tmp/agama-health /tmp/agama-index /tmp/agama-reader /tmp/agama-vol12
            if curl -fsSL --max-time 20 "${base}health.txt" -o /tmp/agama-health \
              && curl -fsSL --max-time 20 "${base}" -o /tmp/agama-index \
              && curl -fsSL --max-time 20 "${base}reader.html?vol=12" -o /tmp/agama-reader \
              && curl -fsSL --max-time 20 "${base}volumes/12.md" -o /tmp/agama-vol12 \
              && grep -q 'agama-pages-ok' /tmp/agama-health \
              && grep -q '제1~12권' /tmp/agama-index \
              && grep -q '잡아함경 쉬운 완전읽기' /tmp/agama-reader \
              && grep -q '제12권' /tmp/agama-vol12; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" -eq 1
          echo "Verified live site: ${base}"
