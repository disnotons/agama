name: Deploy Agama Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '.deployment/**'
      - '.github/workflows/report-pages-runs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: agama-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Agama
        uses: actions/checkout@v4

      - name: Verify standalone webbook source
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f reader.html
          test -f reader.js
          test -f style.css
          test -f app.js
          test -f volumes.js

          latest_info="$(node <<'NODE'
          global.window={};
          require('./volumes.js');
          const p=window.SA_VOLUMES.filter(v=>v[4]==='published');
          if(!p.length) process.exit(1);
          const v=p[p.length-1];
          process.stdout.write(`${v[0]} ${v[1]} ${v[2]} ${v[3]} ${String(v[0]).padStart(2,'0')}`);
          NODE
          )"
          read -r latest_vol latest_start latest_end latest_count latest_pad <<< "$latest_info"

          grep -q "제1~${latest_vol}권" index.html
          grep -q "제1~${latest_end}경" index.html
          grep -q "\[${latest_vol},${latest_start},${latest_end},${latest_count},\"published\"" volumes.js

          for n in $(node <<'NODE'
          global.window={};
          require('./volumes.js');
          for (const v of window.SA_VOLUMES.filter(v=>v[4]==='published')) console.log(String(v[0]).padStart(2,'0'));
          NODE
          ); do
            if test -f "volumes/${n}.md"; then
              :
            else
              test -f "volumes/${n}.seg1.mdpart"
            fi
          done

          if test -f "volumes/${latest_pad}.md"; then
            grep -q "제${latest_vol}권" "volumes/${latest_pad}.md"
          else
            grep -q "제${latest_vol}권" "volumes/${latest_pad}.seg1.mdpart"
          fi

          test -f ma/index.html
          test -f ma/reader.html
          test -f ma/reader.js
          test -f ma/app.js
          test -f ma/volumes.js
          test -f ma/toc.html
          test -f ma/data/01.part1
          test -f ma/data/02.part1
          grep -q '중아함경 쉬운 완전읽기' ma/index.html

          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const zlib=require('zlib');
          const dir='ma/data';
          const names=fs.readdirSync(dir);
          const groups=new Map();

          function add(key,index,name){
            if(!groups.has(key)) groups.set(key,[]);
            groups.get(key).push({index,name});
          }

          for(const name of names){
            let m=name.match(/^(\d{2})\.part(\d+)$/);
            if(m){ add(`volume-${m[1]}`,Number(m[2]),name); continue; }
            m=name.match(/^(.+)\.g(\d+)$/);
            if(m){ add(`gzip-${m[1]}`,Number(m[2]),name); }
          }

          for(const [label,items] of groups){
            items.sort((a,b)=>a.index-b.index);
            for(let i=0;i<items.length;i++){
              if(items[i].index!==i+1) throw new Error(`${label}: missing fragment before ${items[i].name}`);
            }
            let b64=items.map(x=>fs.readFileSync(path.join(dir,x.name),'utf8')).join('').replace(/\s+/g,'');
            const rem=b64.length%4;
            if(rem===1) throw new Error(`${label}: invalid base64 length ${b64.length}`);
            if(rem) b64+='='.repeat(4-rem);
            const zipped=Buffer.from(b64,'base64');
            const text=zlib.gunzipSync(zipped).toString('utf8');
            if(!text.trim()) throw new Error(`${label}: empty decoded text`);
            console.log(`Verified ${label}: ${items.length} fragment(s), ${text.length} chars`);
          }
          NODE

          echo "Agama source verification passed through volume ${latest_vol}."

      - name: Stage Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp index.html reader.html reader.js style.css app.js volumes.js dist/
          cp -R volumes dist/
          cp -R ma dist/
          printf 'agama-pages-ok\n' > dist/health.txt
          touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published Agama site
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}/"

          latest_info="$(node <<'NODE'
          global.window={};
          require('./volumes.js');
          const p=window.SA_VOLUMES.filter(v=>v[4]==='published');
          if(!p.length) process.exit(1);
          const v=p[p.length-1];
          process.stdout.write(`${v[0]} ${v[1]} ${v[2]} ${v[3]} ${String(v[0]).padStart(2,'0')}`);
          NODE
          )"
          read -r latest_vol latest_start latest_end latest_count latest_pad <<< "$latest_info"

          if test -f "volumes/${latest_pad}.md"; then
            latest_remote="volumes/${latest_pad}.md"
          else
            latest_remote="volumes/${latest_pad}.seg1.mdpart"
          fi

          ok=0
          for i in $(seq 1 12); do
            rm -f /tmp/agama-health /tmp/agama-index /tmp/agama-reader /tmp/agama-volumes /tmp/agama-latest /tmp/agama-ma-index /tmp/agama-ma-reader /tmp/agama-ma-data
            if curl -fsSL --max-time 20 "${base}health.txt" -o /tmp/agama-health \
              && curl -fsSL --max-time 20 "${base}" -o /tmp/agama-index \
              && curl -fsSL --max-time 20 "${base}reader.html?vol=${latest_vol}" -o /tmp/agama-reader \
              && curl -fsSL --max-time 20 "${base}volumes.js" -o /tmp/agama-volumes \
              && curl -fsSL --max-time 20 "${base}${latest_remote}" -o /tmp/agama-latest \
              && curl -fsSL --max-time 20 "${base}ma/" -o /tmp/agama-ma-index \
              && curl -fsSL --max-time 20 "${base}ma/reader.html?vol=1" -o /tmp/agama-ma-reader \
              && curl -fsSL --max-time 20 "${base}ma/data/01.part1" -o /tmp/agama-ma-data \
              && grep -q 'agama-pages-ok' /tmp/agama-health \
              && grep -q "제1~${latest_vol}권" /tmp/agama-index \
              && grep -q "제1~${latest_end}경" /tmp/agama-index \
              && grep -q '잡아함경 쉬운 완전읽기' /tmp/agama-reader \
              && grep -q "\[${latest_vol},${latest_start},${latest_end},${latest_count},\"published\"" /tmp/agama-volumes \
              && grep -q "제${latest_vol}권" /tmp/agama-latest \
              && grep -q '중아함경 쉬운 완전읽기' /tmp/agama-ma-index \
              && grep -q '중아함경 쉬운 완전읽기' /tmp/agama-ma-reader; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" -eq 1
          echo "Verified live site through Agama volume ${latest_vol}: ${base}"
