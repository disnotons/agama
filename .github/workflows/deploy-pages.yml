name: Deploy Agama Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '.deployment/**'
      - '.github/workflows/report-pages-runs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: agama-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Agama
        uses: actions/checkout@v4

      - name: Verify source files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f reader.html
          test -f reader.js
          test -f style.css
          test -f app.js
          test -f volumes.js
          test -f ma/index.html
          test -f ma/reader.html
          test -f ma/reader.js
          test -f ma/read.html
          test -f ma/read.js
          test -f ma/volumes.js
          test -f ma/data/03.part1
          test -f ma/data/03.part2
          test -f ma/data/03.part3
          test -f ma/data/04.part1
          test -f ma/data/04.part2
          test -f ma/data/04.part3
          echo 'Source files present.'

      - name: Diagnostic check for MA11 and MA18 bundles
        shell: bash
        run: |
          node <<'NODE' || true
          const fs=require('fs');
          const zlib=require('zlib');
          function check(base,count,label){
            try{
              let b64='';
              for(let i=1;i<=count;i++) b64+=fs.readFileSync(`ma/data/${base}.part${i}`,'utf8');
              b64=b64.replace(/\s+/g,'');
              const rem=b64.length%4;
              if(rem===1) throw new Error(`invalid base64 length ${b64.length}`);
              if(rem) b64+='='.repeat(4-rem);
              const md=zlib.gunzipSync(Buffer.from(b64,'base64')).toString('utf8');
              console.log(`OK ${label}: ${md.length} chars`);
            }catch(e){
              console.error(`DAMAGED ${label}: ${e.message}`);
            }
          }
          check('03',3,'MA11');
          check('04',3,'MA18');
          NODE

      - name: Stage Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp index.html reader.html reader.js style.css app.js volumes.js dist/
          cp -R volumes dist/
          cp -R ma dist/
          printf 'agama-pages-ok\n' > dist/health.txt
          touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published site and MA repair assets
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}/"
          ok=0
          for i in $(seq 1 12); do
            rm -f /tmp/health /tmp/readhtml /tmp/readjs /tmp/03p1 /tmp/03p2 /tmp/03p3 /tmp/04p1 /tmp/04p2 /tmp/04p3
            if curl -fsSL --max-time 20 "${base}health.txt" -o /tmp/health \
              && curl -fsSL --max-time 20 "${base}ma/read.html?r=20260824f" -o /tmp/readhtml \
              && curl -fsSL --max-time 20 "${base}ma/read.js?r=20260824f" -o /tmp/readjs \
              && curl -fsSL --max-time 20 "${base}ma/data/03.part1" -o /tmp/03p1 \
              && curl -fsSL --max-time 20 "${base}ma/data/03.part2" -o /tmp/03p2 \
              && curl -fsSL --max-time 20 "${base}ma/data/03.part3" -o /tmp/03p3 \
              && curl -fsSL --max-time 20 "${base}ma/data/04.part1" -o /tmp/04p1 \
              && curl -fsSL --max-time 20 "${base}ma/data/04.part2" -o /tmp/04p2 \
              && curl -fsSL --max-time 20 "${base}ma/data/04.part3" -o /tmp/04p3 \
              && grep -q 'agama-pages-ok' /tmp/health \
              && grep -q '20260824f' /tmp/readhtml \
              && grep -q "no:11,title:'염유경',kind:'base'" /tmp/readjs \
              && grep -q "no:18,title:'사자경',kind:'base'" /tmp/readjs; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" -eq 1
          node <<'NODE'
          const fs=require('fs'),zlib=require('zlib');
          function verify(prefix,label){
            let b64='';
            for(let i=1;i<=3;i++) b64+=fs.readFileSync(`/tmp/${prefix}p${i}`,'utf8');
            b64=b64.replace(/\s+/g,'');
            const rem=b64.length%4;
            if(rem===1) throw new Error(`${label}: invalid base64 length`);
            if(rem)b64+='='.repeat(4-rem);
            const md=zlib.gunzipSync(Buffer.from(b64,'base64')).toString('utf8');
            if(!md.includes(label==='MA11'?'염유경':'사자경')) throw new Error(`${label}: wrong decoded content`);
            console.log(`LIVE OK ${label}: ${md.length} chars`);
          }
          verify('03','MA11');
          verify('04','MA18');
          NODE
          echo "Published-site verification passed: ${base}"
